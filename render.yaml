databases:
  - name: civiclaws-db
    databaseName: civiclaws
    user: civiclaws_user
    plan: basic-256mb
    ipAllowList: []
services:
  - type: web
    name: smart-legal-citizen-support
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: smart-legal-citizen-support.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: civiclaws-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: https://smart-legal-citizen-support.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
